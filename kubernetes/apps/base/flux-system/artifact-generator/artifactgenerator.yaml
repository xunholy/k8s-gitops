---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: k8s-gitops
  namespace: flux-system
spec:
  sources:
    - alias: repo
      kind: OCIRepository
      name: flux-system
  # One ExternalArtifact per apps/base/<namespace>/<name>/app directory, named <name>, holding just that
  # directory at the same path, so a merge only reconciles the apps whose files changed. A new app needs
  # no entry here: create apps/base/<namespace>/<name>/{ks.yaml,app/} with the Kustomization and
  # its sourceRef both named <name>.
  pathPattern: "@repo/apps/base/{ns}/{app}/app"
  artifacts:
    - name: "{app}"
      originRevision: "@repo"
      copy:
        - from: "@repo/apps/base/{ns}/{app}/app/"
          to: "@artifact/apps/base/{ns}/{app}/app/"
