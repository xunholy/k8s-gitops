---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Release name and namespace are load-bearing: Rook 1.19's automatic migration
  # stamped the existing Driver and OperatorConfig CRs with
  # meta.helm.sh/release-name=ceph-csi-drivers / release-namespace=rook-ceph so
  # that exactly this release adopts them instead of colliding with them.
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      chart: ceph-csi-drivers
      # Keep in lockstep with the ceph-csi-operator subchart pinned by the
      # rook-ceph chart (Chart.yaml dependencies) — 1.20.7 ships operator 1.0.4.
      version: 1.0.4
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator-charts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: ceph-csi-drivers-values
