monitoring:
  enabled: true
  createPrometheusRules: true
toolbox:
  enabled: true
# Pin the Ceph image via the chart's dedicated cephImage value (NOT cephClusterSpec.cephVersion,
# which the chart forbids and which double-renders cephVersion -> post-render failure). The chart's
# default cephImage.tag drove an unintended squid v19.2.3 -> tentacle v20.2.4 major on the 1.19->1.20
# hop (2026-09-15); require_osd_release is now tentacle, so downgrade is impossible. Pin so future
# chart bumps never drift the Ceph major again -- Ceph upgrades must be deliberate, one major at a time.
cephImage:
  repository: quay.io/ceph/ceph
  tag: v20.2.4
  allowUnsupported: false
cephClusterSpec:
  security:
    cephx:
      # Ceph tentacle flags the aes cephx keys (created under squid) as insecure
      # (AUTH_INSECURE_SERVICE_KEY_TYPE -> HEALTH_ERR). Rotate only the DAEMON keys
      # (mon/mgr/osd/mds) to aes256k; they run in userspace on the ceph image and
      # have no kernel dependency. CSI/client keys are deliberately left on aes:
      # aes256k for krbd/kcephfs needs kernel >= 7.0 and our nodes run 6.18, so
      # rotating those would break RBD/CephFS mounts. Their residual warning stays
      # WARN, not ERR. CVE-2025-30156 hardening.
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k
  cephConfig:
    global:
      bdev_enable_discard: "true" # quote
      bdev_async_discard_threads: "1" # quote
      osd_class_update_on_start: "false" # quote
      device_failure_prediction_mode: local # requires mgr module
      # Persist the audit channel (osd blocklist add etc.) in mon pod logs;
      # it is otherwise written nowhere (RCA 2026-09-10).
      mon_cluster_log_to_stderr: "true" # quote
  cleanupPolicy:
    wipeDevicesFromOtherClusters: true
  crashCollector:
    disable: false
  csi:
    readAffinity:
      enabled: true
  priorityClassNames:
    mon: platform-node-critical
    osd: platform-node-critical
    mgr: platform-cluster-critical
  resources:
    mon:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    osd:
      # Request matches default osd_memory_target (4 GiB); limit gives headroom for
      # backfill/recovery and bootstrap, where Ceph routinely doubles working set.
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 8Gi
  dashboard:
    enabled: true
    urlPrefix: /
    ssl: false
    prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
  mgr:
    modules:
      - name: diskprediction_local
        enabled: true
      - name: insights
        enabled: true
      - name: pg_autoscaler
        enabled: true
      - name: rook
        enabled: true
  network:
    connections:
      requireMsgr2: true
  storage:
    useAllNodes: true
    useAllDevices: false
    devicePathFilter: /dev/disk/by-id/nvme-Micron_7450_MTFDKBA960TFR_.*
    config:
      osdsPerDevice: "1"
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      mountOptions:
        - discard
      parameters:
        compression_mode: aggressive
        compression_algorithm: zstd
        imageFormat: "2"
        imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
        # One kernel client per image instead of one shared client per node:
        # an exclusive-lock break blocklists only that image's client, not
        # every RBD volume on the node (RCA 2026-09-10). Applies to PVs
        # provisioned after this change (mapOptions live in PV volumeAttributes).
        mapOptions: "krbd:noshare"
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/fstype: ext4
cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: csi-ceph-blockpool
  isDefault: false
  deletionPolicy: Delete
cephFileSystems:
  - name: &cephFileSystemName ceph-filesystem
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - failureDomain: host
          replicated:
            size: 3
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: true
        priorityClassName: platform-cluster-critical
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ceph-mds
                  app.kubernetes.io/part-of: *cephFileSystemName
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem
      pool: data0
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/fstype: ext4
cephFileSystemVolumeSnapshotClass:
  enabled: true
  name: csi-ceph-filesystem
  isDefault: false
  deletionPolicy: Delete
cephObjectStores: []
