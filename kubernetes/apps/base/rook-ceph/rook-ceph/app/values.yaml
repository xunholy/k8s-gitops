priorityClassName: platform-cluster-critical
csi:
  # REQUIRED on 1.21.0: the chart dropped this default from values.yaml but the
  # operator ConfigMap template still renders it, so it comes out empty, the
  # operator reads "" as false and deletes the rook-ceph CephConnection and
  # ClientProfile on every mon reconcile -- breaking new RBD mounts, provisioning
  # and snapshots for every PVC. Re-check whether upstream restored the default
  # before removing this.
  createCsiOperatorResources: true
  # The old csi.* driver settings (kernel mount options, liveness, priority
  # classes, csi-metrics ServiceMonitor) are no longer read since Rook 1.20 split
  # the drivers into ceph-csi-drivers: priority classes live in
  # ../csi-drivers/values.yaml, the CephFS kernel mount options in the CephCluster
  # spec (cluster/values.yaml csi.cephfs), and the ServiceMonitor selected a
  # Service that no longer exists.
image:
  repository: ghcr.io/rook/ceph
monitoring:
  enabled: true
resources:
  requests:
    memory: 128Mi # unchangable
    cpu: 100m # unchangable
  limits: {}
