---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      enabled: false
    ollamaUrls:
      - "http://ollama.ai-system.svc.cluster.local:11434"
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
