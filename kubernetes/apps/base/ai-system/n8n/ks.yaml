---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: ai-system
spec:
  path: "./apps/base/ai-system/n8n/app"
  wait: false
  targetNamespace: ai-system
  sourceRef:
    kind: ExternalArtifact
    name: n8n
    namespace: flux-system
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: n8n
      VOLSYNC_CLAIM: n8n-main-persistence
      VOLSYNC_SCHEDULE: "2 */6 * * *"
      VOLSYNC_CACHE_CAPACITY: 5Gi
