---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
# The mover runs as 1000: the owner of the shared kopia repository (NFS, files 0600) and, via
# HERMES_UID/HERMES_GID, of Hermes's files.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: hermes
spec:
  sourcePVC: hermes
  trigger:
    schedule: "50 */6 * * *"
  kopia:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 10Gi
    cacheStorageClassName: ceph-block
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    parallelism: 2
    repository: hermes-volsync-secret
    retain:
      daily: 3
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
