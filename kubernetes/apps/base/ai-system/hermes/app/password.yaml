---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# One independent 48-character value per key; read by ExternalSecret "hermes-generated".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - API_SERVER_KEY
    - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - HERMES_DASHBOARD_BASIC_AUTH_SECRET
