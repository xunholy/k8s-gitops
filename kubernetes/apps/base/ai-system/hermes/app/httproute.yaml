---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# LAN only (envoy-internal), never published. Hermes authenticates both itself: the dashboard
# with its basic-auth login, the API with API_SERVER_KEY as a bearer token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network-system
      sectionName: https
  hostnames:
    - 'hermes.${CLUSTER_DOMAIN}'
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
          weight: 100
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network-system
      sectionName: https
  hostnames:
    - 'hermes-api.${CLUSTER_DOMAIN}'
  rules:
    - backendRefs:
        - name: hermes
          port: 8642
          weight: 100
