---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "hermes" (vault "kubernetes"). Every field must exist in the item, even when
# unused; a placeholder value is fine. To give Hermes another key (OPENROUTER_API_KEY,
# TELEGRAM_BOT_TOKEN, ...), add the field to the item and a line here.
#   ANTHROPIC_API_KEY      Console API key, used by Hermes itself and by `claude -p`
#   API_SERVER_KEY         bearer token for the OpenAI-compatible API (:8642)
#   HERMES_DASHBOARD_*     login for the web dashboard (:9119); it refuses to start without one
#   WHATSAPP_ALLOWED_USERS numbers allowed to talk to the bot, country code, no "+"
#   GITHUB_TOKEN           fine-grained PAT for gh/git pushes from Claude Code runs
#
# These land in the container's environment, so the agent's shell can read every one of them.
# Scope them on that basis. GITHUB_TOKEN in particular must never have write access to this
# repo or anything else Flux pulls from: main requires signed commits but not a PR, and commits
# made through the GitHub API come out signed, so write access here is cluster-admin by proxy.
# Give it only the repos Hermes works on, with branch protection that requires a PR there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes
    template:
      data:
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .HERMES_DASHBOARD_BASIC_AUTH_SECRET }}"
        WHATSAPP_ALLOWED_USERS: "{{ .WHATSAPP_ALLOWED_USERS }}"
        GH_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes
