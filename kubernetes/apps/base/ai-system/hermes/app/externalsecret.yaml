---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GH_TOKEN comes from the 1Password item "flux" (FLUX_GITHUB_TOKEN), the cluster's existing
# GitHub token. Everything Hermes only needs internally is generated in-cluster below
# (hermes-generated), so Hermes has no 1Password item of its own.
#
# These land in the container's environment, so the agent's shell can read every one of them.
# ACCEPTED RISK (2026-10-19, owner's call): FLUX_GITHUB_TOKEN is a classic PAT with `repo` and
# `write:packages` and admin on this repo. Anything that can steer the agent (a web page, a
# message) can push to main, which Flux deploys, and can remove the branch rules that would stop
# it, on every xunholy repo. To close that, point GH_TOKEN at a fine-grained token limited to the
# repos Hermes works on, never this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes
    template:
      data:
        GH_TOKEN: "{{ .FLUX_GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: flux
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Random values only Hermes uses, generated once (CreatedOnce: never rotated under a running
# agent). Deleting the Secret generates new ones.
#   API_SERVER_KEY                       bearer token for the OpenAI-compatible API (:8642)
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD dashboard login (user in helmrelease.yaml)
#   HERMES_DASHBOARD_BASIC_AUTH_SECRET   dashboard session signing key
# Read one with:
#   kubectl -n ai-system get secret hermes-generated \
#     -o jsonpath='{.data.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-generated
spec:
  refreshPolicy: CreatedOnce
  target:
    name: hermes-generated
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes
