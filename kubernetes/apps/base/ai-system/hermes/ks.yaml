---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: ai-system
  labels:
    gitops.owncloud.ai/timeout: long
spec:
  path: "./apps/base/ai-system/hermes/app"
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: hermes
    namespace: flux-system
  targetNamespace: ai-system
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: hermes
      VOLSYNC_CLAIM: hermes
      VOLSYNC_SCHEDULE: "50 */6 * * *"
