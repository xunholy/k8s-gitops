---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpoller-secret
    template:
      data:
        # The UDM serves a self-signed cert (CN=unifi.local, no IP SAN), so hostname
        # verification can't pass; ssl_cert_paths pins that exact cert instead.
        up.conf: |
          [poller]
            quiet = true

          [prometheus]
            disable = false
            http_listen = "0.0.0.0:9130"
            report_errors = false

          [influxdb]
            disable = true

          [loki]
            disable = true

          [datadog]
            enable = false

          [webserver]
            enable = false

          [unifi]
            dynamic = false

          [unifi.defaults]
            url = "https://192.168.1.1"
            api_key = "{{ .UNPOLLER_API_KEY }}"
            sites = ["all"]
            save_sites = true
            save_dpi = true
            verify_ssl = false
            ssl_cert_paths = ["/etc/unpoller/udm.pem"]
  dataFrom:
    - extract:
        key: unpoller
