---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies-game-servers
  namespace: game-servers
  labels:
    gitops.owncloud.ai/defaults: disabled
spec:
  decryption:
    provider: sops
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: "./apps/base/game-servers/network-policies/app"
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: network-policies-game-servers
    namespace: flux-system
  targetNamespace: game-servers
