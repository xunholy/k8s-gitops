---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arena-platform
  namespace: game-servers
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: "./apps/base/game-servers/arena-platform/app"
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: arena-platform
    namespace: flux-system
  targetNamespace: game-servers
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: arena-platform
      VOLSYNC_CLAIM: arena-platform-data
      VOLSYNC_SCHEDULE: "24 */6 * * *"
      VOLSYNC_CACHE_CAPACITY: 2Gi
      VOLSYNC_RETAIN_DAILY: "7"
