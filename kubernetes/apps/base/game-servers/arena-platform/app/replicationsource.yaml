---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: arena-platform
spec:
  sourcePVC: arena-platform-data
  trigger:
    schedule: "24 */6 * * *"
  kopia:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 2Gi
    cacheStorageClassName: ceph-block
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    parallelism: 2
    repository: arena-platform-volsync-secret
    retain:
      daily: 7
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
