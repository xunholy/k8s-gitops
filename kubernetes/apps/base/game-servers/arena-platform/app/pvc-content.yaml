---
# Private game content: asset packs under packs/<id> (PACK_DIR) and maps under maps/ (MAPS_DIR).
# This is the only place the original game's assets and decoded maps exist in the cluster: they
# are never in git or the image. The owner fills it from his PC with scripts/sync-to-cluster.sh
# in the app repo (docs/deploy.md there). Rebuildable from that PC, so no VolSync backup.
# Sized for two packs plus the staging copy the sync script writes before swapping one in.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arena-platform-content
  namespace: game-servers
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
