---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kick-vision-hub
  namespace: game-servers
  labels:
    gitops.owncloud.ai/timeout: long
spec:
  path: "./apps/base/game-servers/kick-vision-hub/app"
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: kick-vision-hub
    namespace: flux-system
  targetNamespace: game-servers
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: kick-vision-hub
      VOLSYNC_CLAIM: kick-vision-hub-ceph
      VOLSYNC_SCHEDULE: "40 */6 * * *"
      VOLSYNC_RETAIN_DAILY: "7"
