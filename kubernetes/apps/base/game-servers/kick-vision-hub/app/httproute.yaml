---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# On the LAN (envoy-internal) and off it (envoy-external, through the Cloudflare tunnel). Every
# request needs an API key at the gateway (securitypolicy.yaml) before it reaches the hub, which
# then checks its own bearer token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kick-vision-hub
  annotations:
    external-dns.kubernetes.io/external: 'true'
spec:
  parentRefs:
    - name: envoy-external
      namespace: network-system
      sectionName: https
    - name: envoy-internal
      namespace: network-system
      sectionName: https
  hostnames:
    - 'kv-hub.${CLUSTER_DOMAIN}'
  rules:
    - backendRefs:
        - name: kick-vision-hub
          port: 8780
          weight: 100
      # a KB file is tens of MB and a navmesh more: longer than Envoy's 15 s default route timeout
      timeouts:
        request: 10m
