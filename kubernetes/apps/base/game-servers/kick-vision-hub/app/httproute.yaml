---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# LAN only (envoy-internal), never published.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kick-vision-hub
  namespace: game-servers
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network-system
      sectionName: https
  hostnames:
    - 'kv-hub.${CLUSTER_DOMAIN}'
  rules:
    - backendRefs:
        - name: kick-vision-hub
          port: 8780
          weight: 100
