---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The gateway's API keys (securitypolicy.yaml): one entry per client, named after it. "engine"
# is the hub token itself, so a PC that has the token gets in (the client sends it as the key
# too). To give a PC a key of its own, which can be revoked without rotating the token, add a
# field to the 1Password item "kick-vision-hub" and a line here, e.g.
# `rig: "{{ .KV_HUB_KEY_RIG }}"`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kick-vision-hub-api-keys
  namespace: game-servers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kick-vision-hub-api-keys
    template:
      data:
        engine: "{{ .KV_HUB_TOKEN }}"
  dataFrom:
    - extract:
        key: kick-vision-hub
