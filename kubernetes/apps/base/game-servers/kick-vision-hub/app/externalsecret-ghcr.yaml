---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The image is private: pulled with the cluster's existing GitHub token (1Password item "flux",
# field FLUX_GITHUB_TOKEN, the one the Flux alerts and preview environments use). It needs the
# read:packages scope.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kick-vision-hub-ghcr
  namespace: game-servers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kick-vision-hub-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"xunholy","password":"{{ .FLUX_GITHUB_TOKEN }}","auth":"{{ printf "%s:%s" "xunholy" .FLUX_GITHUB_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: flux
