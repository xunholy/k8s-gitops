---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The image is private: a pull secret from the same 1Password item, fields GHCR_USERNAME and
# GHCR_TOKEN (a GitHub token with read:packages only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kick-vision-hub-ghcr
  namespace: game-servers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kick-vision-hub-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: kick-vision-hub
