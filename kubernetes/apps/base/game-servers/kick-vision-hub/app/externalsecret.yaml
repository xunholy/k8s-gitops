---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The hub's bearer token: 1Password item "kick-vision-hub", field KV_HUB_TOKEN (the item also
# holds GHCR_USERNAME / GHCR_TOKEN for the image pull secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kick-vision-hub
  namespace: game-servers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kick-vision-hub
    template:
      data:
        KV_HUB_TOKEN: "{{ .KV_HUB_TOKEN }}"
  dataFrom:
    - extract:
        key: kick-vision-hub
