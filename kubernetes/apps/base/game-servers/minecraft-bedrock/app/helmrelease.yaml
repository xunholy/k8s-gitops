---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-bedrock
  namespace: game-servers
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: minecraft-bedrock
  values:
    fullnameOverride: *app
    serviceAnnotations:
      lbipam.cilium.io/ips: ${CLUSTER_LB_MINECRAFT_BEDROCK}
  valuesFrom:
    - kind: ConfigMap
      name: mincraft-bedrock-values
    - kind: Secret
      name: mincraft-bedrock-secret-values
  postRenderers:
    # IMPORTANT: Does not work with multus when using hostNetwork: true
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: minecraft-bedrock-minecraft-bedrock
            patch: |
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
