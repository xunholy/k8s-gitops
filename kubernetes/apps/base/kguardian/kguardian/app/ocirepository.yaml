---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Released chart: kguardian 1.17.0 — SIMPLIFICATION complete: the assistant
    # is a single workload (llm-bridge) that runs the 12 tools AND policy/seccomp
    # generation in-process. The mcp-server and advisor-serve components are
    # retired; this chart no longer renders them, so Flux/Helm prunes the
    # kguardian-mcp-server Deployment on reconcile.
    tag: 1.17.0
  url: oci://ghcr.io/kguardian-dev/charts/kguardian
