---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Released chart: kguardian 1.19.2 — IPv6/dual-stack support: controller
    # captures both address families (v1.10.0), broker resolves pods by any of
    # their addresses (v1.13.0), and all generators emit /128 for IPv6 peers.
    # Image versions are pinned in app/values.yaml (controller v1.10.0, broker
    # v1.13.0, frontend v1.13.0, llm-bridge v1.8.0, evaluator v0.4.0), which
    # override the chart defaults.
    # PREVIEW 2026-09-03: chart 1.20.0-pr1427 (PR #1427 build) — ships the
    # SeccompProfile CRD + seccomp.distribute RBAC. Previous released: 1.20.0
    tag: 1.20.0-pr1427
  url: oci://ghcr.io/kguardian-dev/charts/kguardian
