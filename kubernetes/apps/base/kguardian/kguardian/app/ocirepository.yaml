---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Released chart: kguardian 1.17.1 — SIMPLIFICATION complete: the assistant
    # is a single workload (llm-bridge) that runs the 12 tools AND policy/seccomp
    # generation in-process. mcp-server and advisor-serve are retired (this chart
    # no longer renders them). Image versions are pinned in app/values.yaml
    # (llm-bridge v1.6.1, frontend v1.11.3), which override the chart defaults.
    tag: 1.17.1
  url: oci://ghcr.io/kguardian-dev/charts/kguardian
