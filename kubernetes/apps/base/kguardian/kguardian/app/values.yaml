---
# Component image tags are NOT pinned here: the chart's release-please defaults are
# the source of truth, so a chart bump moves every component together. Pinning them
# by digest silently held broker/frontend/llm-bridge on 1.24.0-era images through the
# chart 1.25.0 upgrade (2026-09-17), and Renovate cannot see these blocks anyway
# (no `repository:` key), so they never got a bump PR. Only postgres stays pinned.
controller:
  # TEMPORARY (kguardian #1533 live validation round 3b): PR #1652 preview build,
  # head 16becb32c (digest matched to its pr-build push). Revert after validation.
  image:
    sha: sha256:b8b1f69bc4fa0a9d7455a8357c9f2b6614a3e3901bcdc527ede0535be79fbee1
  excludedNamespaces:
    - kguardian

broker:
  # Both of the next two now MATCH the chart 1.12.0 defaults (kept explicit
  # for clarity, not because an override is required):
  # - dbPoolMaxSize 32 keeps headroom over audit.inflightPermits (16) so
  #   audit evals can't starve /health + inserts (liveness-flap guard).
  dbPoolMaxSize: 32
  # - NetworkPolicy left disabled: this cluster's controller is a
  #   hostNetwork eBPF DaemonSet, so Cilium sees its traffic as node
  #   identity. Enabling the (now hostNetwork-aware) NP would require
  #   listing the node CIDRs via broker.networkPolicy.allowedNodeCIDRs.
  networkPolicy:
    enabled: false
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# CR-driven seccomp distribution (chart 1.21 / PR #1427). The controller
# watches SeccompProfile CRs and writes one file per CR under
# /var/lib/kubelet/seccomp/kguardian/ (Talos uses the default kubelet root).
# Nothing reaches a node without a CR. Capture tier full is the chart default.
seccomp:
  distribute: true
  installCRDs: true
syscalls:
  captureLevel: full

llmBridge:
  enabled: true
  secrets:
    # OpenAI DISABLED 2026-07-29: its billing quota is exhausted, and llm-bridge
    # picks the first available provider as the default (index.ts resolveProvider
    # → availableProviders[0], OpenAI is first). With OpenAI wired, every
    # frontend request (which sends no explicit provider) defaulted to the dead
    # OpenAI key and errored. Disabling it makes Anthropic the sole — and thus
    # default — provider. Re-enable once the OpenAI account is topped up.
    openai:
      enabled: false
      name: "kguardian-secrets"
    # Claude/Anthropic (2026-07-29): the working provider. Key lives in the
    # out-of-band Secret kguardian-anthropic (key: api-key), created imperatively
    # like kguardian-secrets — never committed here.
    anthropic:
      enabled: true
      name: "kguardian-anthropic"

# kguardian-evaluator — audit-mode policy preview (chart 1.11.0+).
# Watches AuditNetworkPolicy / AuditClusterNetworkPolicy CRDs and reports
# flows that *would* be denied (and that are explicitly allowed) without
# blocking traffic. Surfaces in the frontend's "Audit" panel.
database:
  # Pin postgres image — `latest` drifts and PG major-version bumps break the on-disk format
  image:
    tag: "18.1"
    sha: "sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f"
  # Persistent storage so the DB survives pod restarts (chart default is emptyDir → wipes on every recreate)
  persistence:
    enabled: true
    existingClaim: kguardian-db
  # Sized to observed load: postgres uses 2.0–2.8 cores under autovacuum + ingest pressure
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: "2"
      memory: 512Mi

# Chart 1.23.0: compute gauges default on (cgroup files only). The scheduler
# contention probe (blame) is opt-in; enabled here after measuring 5-23m CPU
# per controller at 40-70k context switches/s on this cluster (2026-09-10).
compute:
  contention:
    enabled: true
