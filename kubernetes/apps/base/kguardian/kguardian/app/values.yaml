---
controller:
  image:
    # Released pin: controller v1.10.1 — TCP direction classified from the
    # socket's pre-transition state (replaces the port>1024 heuristic that
    # flipped accepted connections into per-ephemeral-port egress rows).
    # Released pin: controller v1.12.1 — reconciler and watcher ignore
    # Succeeded/Failed/deleting pods (their broker rows were never marked dead).
    # Released pin: controller v1.14.0 — per-container compute registry +
    # cgroup sampler (CPU/memory/PSI/throttling), sched_contention eBPF probe
    # (run-queue latency + noisy-neighbour blame), compute for excluded namespaces.
    # Released pin: controller v1.15.0 — kernel seccomp verdicts captured and
    # surfaced as denials (#1574). Replaces the pr-1574 canary run by hand on
    # 2026-09-14 while the HelmRelease was suspended.
    tag: "v1.15.0"
    sha: "sha256:c8931912a8ce7de6a7a55c289b668632ad17a90546578a4c5bb1b1852c43a9ca"
  excludedNamespaces:
    - kguardian

broker:
  # Both of the next two now MATCH the chart 1.12.0 defaults (kept explicit
  # for clarity, not because an override is required):
  # - dbPoolMaxSize 32 keeps headroom over audit.inflightPermits (16) so
  #   audit evals can't starve /health + inserts (liveness-flap guard).
  dbPoolMaxSize: 32
  # - NetworkPolicy left disabled: this cluster's controller is a
  #   hostNetwork eBPF DaemonSet, so Cilium sees its traffic as node
  #   identity. Enabling the (now hostNetwork-aware) NP would require
  #   listing the node CIDRs via broker.networkPolicy.allowedNodeCIDRs.
  networkPolicy:
    enabled: false
  image:
    # Released pin: broker v1.13.1 — /pod/traffic/{name} bounded (20k clamp,
    # newest first), guarding generators against pathological pods.
    # Released pin: broker v1.15.1 — peer identity resolved at ingest, late
    # resolve, start-time guard, GET /pod/ip?at=, stale-alive sweep.
    # Released pin: broker v1.17.0 — compute ingest/history/findings engine
    # (noisy-neighbor, cpu-contended, cpu-throttled, memory-pressure,
    # memory-limit-thrash), 7-day retention with 5-min downsampling.
    # Released pin: broker v1.18.0 — seccomp verdict ingest + denial surfacing
    # (#1574). Replaces the pr-1574 canary.
    tag: "v1.18.0"
    sha: "sha256:7d5d2a12e1177277036a55a5f844997212381e79fc9b52a82b55ad773efb4e3a"
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

frontend:
  image:
    # Released pin: frontend v1.13.1 — graph focus-mode fixes: focus exits
    # when the focused node disappears (namespace switch), and the focus
    # button stays on the card for long pod/service names.
    # Released pin: frontend v1.15.0 — stored peer identity + guard on the
    # map and generators, DaemonSets toggle (teal, off by default).
    # Released pin: frontend v1.17.0 — live compute gauges, contention edges,
    # compute findings; docked assistant, viewport kept on expand, Policy
    # Builder network format switch (audit / NetworkPolicy / Cilium).
    # Released pin: frontend v1.18.0 — seccomp denials in the UI (#1574);
    # selecting a card on the map opens it (#1575).
    tag: "v1.18.0"
    sha: "sha256:f83b49140923b93f57967a0f49da27ffb2329ceeb6d1f3fc05678b38378d61a8"

# CR-driven seccomp distribution (chart 1.21 / PR #1427). The controller
# watches SeccompProfile CRs and writes one file per CR under
# /var/lib/kubelet/seccomp/kguardian/ (Talos uses the default kubelet root).
# Nothing reaches a node without a CR. Capture tier full is the chart default.
seccomp:
  distribute: true
  installCRDs: true
syscalls:
  captureLevel: full

llmBridge:
  enabled: true
  image:
    # Released pin: llm-bridge v1.6.1 — in-process assistant (WS-C, advisor-free)
    # + seccomp arch-validation guard (unknown arch now errors instead of
    # silently returning an unusable profile). mcp-server + advisor-serve retired
    # in chart 1.17.0.
    # Released pin: llm-bridge v1.9.1 — stored peer identity + guard.
    # Released pin: llm-bridge v1.11.0 — get_pod_compute / get_compute_findings /
    # get_node_contention tools.
    tag: "v1.11.0"
    sha: "sha256:90911c5c35c3ec8ad94a44fc75692ea771acdc75f6c06ed64d30ab8a0623c727"
  secrets:
    # OpenAI DISABLED 2026-07-29: its billing quota is exhausted, and llm-bridge
    # picks the first available provider as the default (index.ts resolveProvider
    # → availableProviders[0], OpenAI is first). With OpenAI wired, every
    # frontend request (which sends no explicit provider) defaulted to the dead
    # OpenAI key and errored. Disabling it makes Anthropic the sole — and thus
    # default — provider. Re-enable once the OpenAI account is topped up.
    openai:
      enabled: false
      name: "kguardian-secrets"
    # Claude/Anthropic (2026-07-29): the working provider. Key lives in the
    # out-of-band Secret kguardian-anthropic (key: api-key), created imperatively
    # like kguardian-secrets — never committed here.
    anthropic:
      enabled: true
      name: "kguardian-anthropic"

# kguardian-evaluator — audit-mode policy preview (chart 1.11.0+).
# Watches AuditNetworkPolicy / AuditClusterNetworkPolicy CRDs and reports
# flows that *would* be denied (and that are explicitly allowed) without
# blocking traffic. Surfaces in the frontend's "Audit" panel.
evaluator:
  image:
    # Released pin: evaluator v0.4.0 — IPv6 CIDR matching covered end to end.
    # Released pin: evaluator v0.4.2 — dependency-only rebuild, no behaviour change;
    # matches the chart 1.24.0 default.
    tag: "v0.4.2"
    sha: "sha256:9b95d1fc9076563bb78b60721bfe8d559fc0fb394574a9380b7d2e6c9c573cc7"

database:
  # Pin postgres image — `latest` drifts and PG major-version bumps break the on-disk format
  image:
    tag: "18.1"
    sha: "sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f"
  # Persistent storage so the DB survives pod restarts (chart default is emptyDir → wipes on every recreate)
  persistence:
    enabled: true
    existingClaim: kguardian-db
  # Sized to observed load: postgres uses 2.0–2.8 cores under autovacuum + ingest pressure
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: "2"
      memory: 512Mi

# Chart 1.23.0: compute gauges default on (cgroup files only). The scheduler
# contention probe (blame) is opt-in; enabled here after measuring 5-23m CPU
# per controller at 40-70k context switches/s on this cluster (2026-09-10).
compute:
  contention:
    enabled: true
