---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: kguardian-db
  annotations:
    # The database had no backup at all until 2026-09-11; the PVC was
    # deleted on 2026-09-10 and ~300 days of traffic/syscall/audit data
    # were unrecoverable. Never prune this on an ownership move.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Backs up the pg_dump output (backup-cronjob.yaml), not the raw PGDATA:
  # PGDATA is 999:999 mode 0700 and the shared Kopia repo is readable only
  # by uid 1000, so no single mover uid can snapshot the data PVC directly.
  sourcePVC: kguardian-db-dumps
  trigger:
    # Two hours after the 02:00 dump CronJob.
    schedule: "0 4 * * *"
  kopia:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 10Gi
    cacheStorageClassName: ceph-block
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    parallelism: 2
    repository: kguardian-db-volsync-secret
    retain:
      daily: 7
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
