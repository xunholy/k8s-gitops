---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The runners register with unholy-bot, the GitHub App Flux already uses: installed on every
# repository with Administration: write. Its credentials stay in one place
# (flux-system/github-auth, SOPS); this copies them under the key names ARC expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-runners-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: flux-github-auth
  target:
    name: github-runners-app
    template:
      data:
        github_app_id: '{{ .githubAppID }}'
        github_app_installation_id: '{{ .githubAppInstallationID }}'
        github_app_private_key: '{{ .githubAppPrivateKey }}'
  dataFrom:
    - extract:
        key: github-auth
