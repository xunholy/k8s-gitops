---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Runners for xunholy/bedrock-broadcaster. Gradle + Kotlin and the Rust core: the heaviest Linux jobs on the account.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bedrock-broadcaster
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/xunholy/bedrock-broadcaster
    githubConfigSecret: github-runners-app
    runnerScaleSetName: bedrock-broadcaster
    minRunners: 0
    maxRunners: 4
    controllerServiceAccount:
      name: gha-runner-scale-set-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          gitops.owncloud.ai/github-runner: "true"
      spec:
        priorityClassName: github-runner
        automountServiceAccountToken: false
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.2@sha256:2dd7caa094a425c041539447cb0e6ae63cda10b5242773764683b695b8fa5613
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 12Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          # Checkouts, the tool cache and build output; node-local, gone with the pod.
          - name: work
            emptyDir:
              sizeLimit: 50Gi
