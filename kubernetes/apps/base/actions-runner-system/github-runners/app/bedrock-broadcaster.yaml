---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Runners for xunholy/bedrock-broadcaster. Gradle + Kotlin and the Rust core: the heaviest Linux jobs on the account.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bedrock-broadcaster
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/xunholy/bedrock-broadcaster
    githubConfigSecret: github-runners-app
    runnerScaleSetName: bedrock-broadcaster
    minRunners: 0
    maxRunners: 4
    controllerServiceAccount:
      name: gha-runner-scale-set-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          gitops.owncloud.ai/github-runner: "true"
      spec:
        priorityClassName: github-runner
        automountServiceAccountToken: false
        # Restricted: this repo's jobs install their toolchains (JDK, Android SDK, rustup)
        # under the runner's home, so nothing needs sudo or root. The libc headers their
        # host links need come with the image (app/resources/Dockerfile).
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/xunholy/actions-runner:2.338.2@sha256:9351ed424d0fc2df03f2b585b46ed05d6153aa80be855664e1b0392ea93cb221
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 12Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          # Checkouts, the tool cache and build output; node-local, gone with the pod.
          - name: work
            emptyDir:
              sizeLimit: 50Gi
