---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
# Reads Kubernetes Secrets in flux-system as the github-auth-reader ServiceAccount, which
# may get exactly one: github-auth (Role in flux-system/flux-instance-extras).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: flux-github-auth
spec:
  provider:
    kubernetes:
      remoteNamespace: flux-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: github-auth-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-auth-reader
automountServiceAccountToken: false
