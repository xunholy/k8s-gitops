---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Runners for xunholy/kick-vision. Python tests and the behaviour benchmark.
# Its CI installs OpenCV and Tesseract system libraries with `sudo apt-get`, so these
# runners keep sudo (Pod Security baseline); bedrock-broadcaster's are restricted.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kick-vision
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/xunholy/kick-vision
    githubConfigSecret: github-runners-app
    runnerScaleSetName: kick-vision
    minRunners: 0
    maxRunners: 3
    controllerServiceAccount:
      name: gha-runner-scale-set-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          gitops.owncloud.ai/github-runner: "true"
      spec:
        priorityClassName: github-runner
        automountServiceAccountToken: false
        containers:
          - name: runner
            image: ghcr.io/xunholy/actions-runner:2.338.2@sha256:89c03a2157d0fc4493b8eb445e524ac161d52a5e77a47f1415760ec055ad37fc
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                memory: 6Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          # Checkouts, the tool cache and build output; node-local, gone with the pod.
          - name: work
            emptyDir:
              sizeLimit: 20Gi
