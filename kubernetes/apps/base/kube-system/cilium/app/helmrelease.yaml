---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
    # tls.ca.cert/key: the SOPS-encrypted common CA (secret-tls-ca.enc.age.yaml).
    - kind: Secret
      name: cilium-tls-ca-values
      valuesKey: values.yaml
  driftDetection:
    mode: enabled
    # Hubble TLS is on the chart default (hubble.tls.auto.method=helm). The CA now
    # comes from the SOPS-encrypted cilium-tls-ca-values Secret, but the server and
    # relay-client certs are still re-signed on every render, so they never match the
    # cluster copy and the correction patch fails ("illegal base64 data"). Ignore
    # their data; the cilium-ca entry stays so a dry-run render never fights it.
    ignore:
      - paths: ["/data"]
        target:
          kind: Secret
          name: cilium-ca
      - paths: ["/data"]
        target:
          kind: Secret
          name: hubble-server-certs
      - paths: ["/data"]
        target:
          kind: Secret
          name: hubble-relay-client-certs
