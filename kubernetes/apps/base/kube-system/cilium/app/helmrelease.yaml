---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
  driftDetection:
    mode: enabled
    # Hubble TLS is on the chart default (hubble.tls.auto.method=helm), so the CA and
    # the server/relay-client certs are regenerated on every render. They never match
    # the cluster copy, and since the 1.20.1 upgrade the correction patch itself fails
    # ("illegal base64 data"), leaving the release stuck in "correcting cluster drift"
    # forever. The live certs are the ones every agent trusts; ignore their data.
    ignore:
      - paths: ["/data"]
        target:
          kind: Secret
          name: cilium-ca
      - paths: ["/data"]
        target:
          kind: Secret
          name: hubble-server-certs
      - paths: ["/data"]
        target:
          kind: Secret
          name: hubble-relay-client-certs
