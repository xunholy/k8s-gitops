---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: daily
  namespace: volsync
spec:
  enabled: true
  # Full maintenance runs have grown to ~3h due to index blob buildup; the 10800s
  # default deadline kills them just before completion, compounding the problem.
  activeDeadlineSeconds: 21600
  trigger:
    schedule: 0 */8 * * *
  repository:
    repository: volsync-maintenance-secret
