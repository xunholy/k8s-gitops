---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-rules
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerAbsent
          expr: |-
            absent(up{job="cert-manager"})
          for: 30m
          annotations:
            summary: >-
              Cert Manager has disappeared from Prometheus service discovery
          labels:
            severity: critical

    - name: certificates
      rules:
        - alert: CertManagerCertExpirySoon
          expr: |-
            avg by (exported_namespace, namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)
          for: 15m
          annotations:
            summary: >-
              The cert {{ $labels.name }} is {{ $value | humanizeDuration }} from expiry and has not renewed
            description: >-
              Threshold is 7 days: every certificate here renews at least 15 days before expiry
              (control-mtls at 15d, Let's Encrypt at 30d), so anything inside 7 days has missed
              its renewal. The previous 21-day threshold fired on control-mtls a week before its
              scheduled renewal.
          labels:
            severity: critical

        - alert: CertManagerCertNotReady
          expr: |-
            max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition!="True"} == 1)
          for: 1h
          annotations:
            summary: >-
              The cert {{ $labels.name }} is not ready to serve traffic
          labels:
            severity: warning

        - alert: CertManagerHittingRateLimits
          expr: |-
            sum by (host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
          for: 15m
          annotations:
            summary: >-
              Cert manager hitting LetsEncrypt rate limits
          labels:
            severity: critical
