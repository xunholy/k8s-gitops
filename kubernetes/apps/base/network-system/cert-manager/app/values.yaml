---
crds:
  enabled: true
# webhook:
#   url:
#     host: cert-manager-webhook.network-system.svc
global:
  # Set the verbosity of cert-manager. Range of 0 - 6 with 6 being the most verbose.
  logLevel: 2
  priorityClassName: platform-cluster-critical
  leaderElection:
    # Override the namespace used to store the ConfigMap for leader election
    namespace: 'network-system'
extraArgs:
  # Use this flag to set a namespace that cert-manager will use to store
  # supporting resources required for each ClusterIssuer (default is kube-system)
  - --cluster-resource-namespace=network-system
  # When this flag is enabled, secrets will be automatically removed when the certificate resource is deleted
  - --enable-certificate-owner-ref=true
  - --dns01-recursive-nameservers=https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
  - --dns01-recursive-nameservers-only
  - --default-issuer-name=letsencrypt-prod
  - --default-issuer-kind=ClusterIssuer
prometheus:
  servicemonitor:
    enabled: true
# Two leader-elected controller replicas spread across nodes. With one replica the chart's
# PDB (minAvailable 1) sat at 0 allowed disruptions and blocked every node drain / Talos
# rolling upgrade (2026-09-16). Two replicas keep the PDB and make drains possible.
replicaCount: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cert-manager
        app.kubernetes.io/component: controller
podDisruptionBudget:
  enabled: true
webhook:
  # Admission webhook: while it is down every Certificate/Issuer create or update is rejected,
  # which also fails any HelmRelease that ships a Certificate. Two replicas, one per node.
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: webhook
