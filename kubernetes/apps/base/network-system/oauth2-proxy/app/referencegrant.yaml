---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
# Allows SecurityPolicies and /oauth2/* HTTPRoutes in the app namespaces below
# to reference the oauth2-proxy Service as their ext-auth / auth-flow backend.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: oauth2-proxy-extauth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: home-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kguardian
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kguardian
  to:
    - group: ''
      kind: Service
      name: oauth2-proxy
