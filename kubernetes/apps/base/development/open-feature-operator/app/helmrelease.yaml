---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-feature-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-feature-operator
  values:
    defaultResources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
