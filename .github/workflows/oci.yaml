---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Publish OCI artifact"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/oci.yaml
      - kubernetes/**

# packages: push the artifact to GHCR. id-token: keyless cosign signing.
permissions:
  contents: read
  packages: write
  id-token: write

# Flux deploys whatever the main tag points at. Overlapping runs (four in the fortnight to
# 2026-10-20) could finish out of order and move the tag back to an older commit, so runs
# queue instead of overlapping: they finish in push order, and a newer push replaces a
# still-pending run, so the last run to tag main is always the newest commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  OCI_REPO: "oci://ghcr.io/xunholy/manifests/${{ github.event.repository.name }}"
  GHCR_REPO: "ghcr.io/xunholy/manifests/${{ github.event.repository.name }}"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COSIGN_EXPERIMENTAL: "true"
      COSIGN_YES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@a526a563786c693807fa57bc36f1dfc8c55bf112 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Crane
        uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5

      - name: Setup Cosign
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07 # main

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create OCI artifact
        run: |
          flux push artifact "$OCI_REPO:$(git rev-parse --short HEAD)" \
            --path="./kubernetes" \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)@sha1:$(git rev-parse HEAD)" \
            --ignore-paths="sops-gpg.encrypted.yaml,sops-age.encrypted.yaml,.sops.pub.asc" \
            --reproducible

      # A manual run from another branch still publishes its commit, but only main moves the tag Flux follows.
      - name: Create OCI artifact tag
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flux tag artifact "$OCI_REPO:$(git rev-parse --short HEAD)" --tag main

      - name: Get the digest of the OCI artifact
        id: crane
        run: |
          DIGEST=$(crane digest "$GHCR_REPO:$(git rev-parse --short HEAD)")
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign the OCI artifact
        env:
          DIGEST: ${{ steps.crane.outputs.DIGEST }}
        run: cosign sign "$GHCR_REPO@$DIGEST" -y
