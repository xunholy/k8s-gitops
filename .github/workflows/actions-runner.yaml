---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build actions-runner"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-runner.yaml
      - kubernetes/apps/base/actions-runner-system/github-runners/app/resources/**
  # Pull requests build and test the image; only main pushes it.
  pull_request:
    paths:
      - .github/workflows/actions-runner.yaml
      - kubernetes/apps/base/actions-runner-system/github-runners/app/resources/**

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xunholy/actions-runner
  CONTEXT: kubernetes/apps/base/actions-runner-system/github-runners/app/resources

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag follows the upstream runner version in the FROM line, so Renovate can
      # offer the bump in the scale sets once a rebuilt image is published.
      - name: Read the runner version
        id: version
        run: |
          version=$(sed -n 's|^FROM ghcr.io/home-operations/actions-runner:\([0-9][0-9.]*\)@.*|\1|p' "$CONTEXT/Dockerfile")
          if [ -z "$version" ]; then
            echo "::error::No runner version in the FROM line of $CONTEXT/Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: actions-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What the upstream image can't do: link a host binary, and compile against the system
      # Python's headers, as the unprivileged runner user.
      - name: Link a host binary as the runner user
        run: |
          docker run --rm --user 1001:1001 --entrypoint bash actions-runner:test -euo pipefail -c '
            printf "#include <stdio.h>\nint main(void) { puts(\"linked\"); return 0; }\n" > /tmp/t.c
            cc /tmp/t.c -o /tmp/t -lpthread -ldl -lm
            /tmp/t
            printf "#include <Python.h>\nint main(void) { return PY_MAJOR_VERSION == 3 ? 0 : 1; }\n" > /tmp/p.c
            cc /tmp/p.c -o /tmp/p $(python3-config --includes)
            /tmp/p && echo "Python.h for $(python3 --version)"
            make --version | head -n1
          '

  # The only job that can write packages, and only from main: a dispatch from another
  # branch builds and tests but can't replace the tag the runners pull.
  push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.test.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      # bedrock-broadcaster.yaml and kick-vision.yaml pin the digest. A rebuilt image reaches the
      # runners through Renovate's digest PR, automerged once CI is green like every image here.
      # Only this job, on main, can publish the image that PR pins.
      - name: Print the digest to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.test.outputs.version }}
        run: echo "::notice title=Pin this digest::${IMAGE}:${VERSION}@${DIGEST}"
