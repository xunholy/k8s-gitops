version: v1alpha1
debug: false
persist: true
# Provides machine specific configuration options.
machine:
  # Defines the role of the machine within the cluster.
  type: controlplane
  # The `token` is used by a machine to join the PKI of the cluster.
  token: ENC[AES256_GCM,data:kN8ZmxpLl1n/XMLgxzzPEeasH4fhx8s=,iv:fgec+boVsRi97/e+v3jTKTi+2O4gSGblZ9BdNuA82So=,tag:Hi3TDpeDBK3zPGkHt+ljgg==,type:str]
  # The root certificate authority of the PKI.
  ca:
    crt: ENC[AES256_GCM,data:,iv:TP1d0dQ4VRXRspm/fXf0bDN4Ojlubdj0UphajG08/14=,tag:RbVFdR+uazN9YC30isaw4A==,type:str]
    key: ENC[AES256_GCM,data:EkdQFLXrbqgU73SshqkKFFqmKeIojS6TnJPRnzk+Cu6AvQvzeAi1jljX9dW8KFLb+dEpQsq9D+8OUJx4mwx1N8CZegEDXCB1NiPIyUiejJsLYA9gDDQvF1/RGpgdoCJKekNV0htXbxgq//V1ysr6IrmloHzxWRKQcHePOxLitOBCWJplICmKw5/S2HeoURSdVu+c8sfgqeq5UjMDVB5l+v3ClBqjqDtUe5YzSpb/X6nG+1Iw,iv:/cq571fkdgMQ4XeSbLGss898ehw1PNoYPzk32AU5JYA=,tag:diTMzKkO7GY8XDRE1kiJIA==,type:str]
  # Extra certificate subject alternative names for the machine's certificate.
  certSANs:
    - api.owncloud.ai
    - talos.api.owncloud.ai
    - 192.168.50.200
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.36.4
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraConfig:
      serializeImagePulls: false
      # Image GC: kubelet default is threshold-only (85/80%) with age-GC off, so every
      # Renovate-bumped image version was retained forever (2,343 images / 399 GiB on
      # talos-eha-ot0, 2026-09-17). Age out images unused for 7d and engage threshold GC
      # earlier. Applied live via talosctl patch mc on all nodes 2026-09-17 (no reboot).
      imageMaximumGCAge: ENC[AES256_GCM,data:PqSVRw==,iv:gqhkZLc6J57b9HttCmRxaW5J+/m7xyvPwmhYcQ9SOzo=,tag:lusvvP/34td5EsqjCWbY2A==,type:str]
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 60
  sysctls:
    # Inotify — required for K8s controllers/operators at scale
    fs.inotify.max_user_instances: "8192"
    fs.inotify.max_user_watches: "1048576"
    # TCP/Network performance — BBR congestion control + buffer tuning
    net.core.default_qdisc: fq
    net.core.rmem_max: "67108864"
    net.core.wmem_max: "67108864"
    net.ipv4.tcp_congestion_control: bbr
    net.ipv4.tcp_fastopen: "3"
    net.ipv4.tcp_mtu_probing: "1"
    net.ipv4.tcp_rmem: 4096 87380 33554432
    net.ipv4.tcp_wmem: 4096 65536 33554432
    net.ipv4.tcp_slow_start_after_idle: "0"
    net.ipv4.tcp_window_scaling: ENC[AES256_GCM,data:sg==,iv:xY/S5P2HrnNHQFTw71JtIabTyF85Ixv4ddIqbg6ymvs=,tag:EsgiZ655EGH5PsBqgpftDA==,type:str]
  network:
    interfaces:
      - deviceSelector:
          physical: ENC[AES256_GCM,data:DZGQLw==,iv:EsURexjI3Tope6K27Wxfh0V/kE4NbyRJak/aPSubBCY=,tag:r/DypTLErNQbJ3rsNf1MNQ==,type:bool]
        dhcp: true
        mtu: 1450
        vip:
          ip: 192.168.50.200
  install:
    diskSelector:
      size: '>= 1TB'
      model: CT1000BX500SSD1
    image: factory.talos.dev/installer/b629e405f5a20ec93f34868f86e6ab24ded1930f5853d0e130fda300b9283a14:v1.14.0
    wipe: true
  registries: {}
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: ENC[AES256_GCM,data:otK7MQ==,iv:Ez6Od5Ns7qhJBctZKKgMCZelrNkY8MwOvjm9Iq5Jq5g=,tag:copRCZd0TyRK7oI9x/7MHQ==,type:bool]
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
        - os:admin
      allowedKubernetesNamespaces:
        - kube-system
        - actions-runner-system
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: false
      resolveMemberNames: true
  time:
    servers:
      - time.cloudflare.com
      - 0.pool.ntp.org
      - time.google.com
  files:
    # REQUIRED: The following documentation explains why these are needed.
    # https://spegel.dev/docs/getting-started/#talos
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
          device_ownership_from_security_context = true
        [metrics]
          address = "0.0.0.0:11234"
cluster:
  # Globally unique identifier for this cluster (base64 encoded random 32 bytes).
  id: GsSf9LerhTOpktH7JMlySUhdB4tdxlX1b6ZDGM7a8ZE=
  # Shared secret of cluster (base64 encoded random 32 bytes).
  secret: ENC[AES256_GCM,data:86SD9KEbW6Bz5W0fvpbrSj9AyH2vkmAu7QQd6RcAv1i6iv9ObJyOQHuEXG4=,iv:UAGRfNceL9voYmD54qTHpHlIadvr8iCUHLiUkMJYyAQ=,tag:sQbfK6PLC/YPCkxOTwzIHg==,type:str]
  # Provides control plane specific configuration options.
  controlPlane:
    endpoint: https://192.168.50.200:6443
  clusterName: cluster-00
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
    cni:
      name: custom
      urls:
        - https://raw.githubusercontent.com/xUnholy/k8s-gitops/main/talos/integrations/cilium/cilium.yaml
  # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
  token: ENC[AES256_GCM,data:S9siTiQ0U26LcQaez0cGuRvqdIIx0JQ=,iv:oP4hqH7MHrm3tAgSr/yGj+zip7P9CZygu6YZhC/MB28=,tag:2XCwenmKnPAZzRbFShVwXw==,type:str]
  # A key used for the [encryption of secret data at rest](https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/).
  secretboxEncryptionSecret: ENC[AES256_GCM,data:4slNwze/qdwRm0d7XIAEZabEAb3n9OkzKwmB5Y7LGPforwqX1AvTn9oGISM=,iv:L0cVwIfF+PkEs3I3o5tJ800KV2m9iCfYG94VW2qX6Js=,tag:kOlRa9krQZUgcEEjGmoHPQ==,type:str]
  # The base64 encoded root certificate authority used by Kubernetes.
  ca:
    crt: ENC[AES256_GCM,data:,iv:gwhDACkO9DaamAM2OAtgsQEy0wQenBgMTp2nRKRE2X0=,tag:7SW9DJuhNz/GNWgbnY7ptg==,type:str]
    key: ENC[AES256_GCM,data:,iv:EsdYayiuKg8pwUcbXDAT5dhCTTmXKzs11zXQ5FlhFZY=,tag:QbCPPPn5x0YqYktdwGQsSQ==,type:str]
  # The base64 encoded aggregator certificate authority used by Kubernetes for front-proxy certificate generation.
  aggregatorCA:
    crt: ENC[AES256_GCM,data:,iv:5/suYcMHWsq6XoGLjXUSHhiYQzr4sovPXBx3dSK1rT0=,tag:jm5UdZNu6XNO9Yy7n2Essg==,type:str]
    key: ENC[AES256_GCM,data:,iv:CvHBpZ8zvFtrVd1siDy08MgFnnOEPMTa+tNvyBACMH8=,tag:LPbIT3uxYey+8EZ8ypApFQ==,type:str]
  # The base64 encoded private key for service account token generation.
  serviceAccount:
    key: ENC[AES256_GCM,data:,iv:vwfconiH2TjEwvc4mxLjhJO5/az+uVAArDMJKTiDTVc=,tag:cWRs+25FTaKhuk6/gEOKXQ==,type:str]
  # API server specific configuration options.
  apiServer:
    # The container image used in the API server manifest.
    image: registry.k8s.io/kube-apiserver:v1.36.4
    # Extra certificate subject alternative names for the API server's certificate.
    certSANs:
      - api.owncloud.ai
      - talos.api.owncloud.ai
      - 192.168.50.200
    extraArgs:
      enable-aggregator-routing: "true"
      feature-gates: MutatingAdmissionPolicy=true
      runtime-config: admissionregistration.k8s.io/v1beta1=true
      oidc-client-id: dex-k8s-authenticator
      oidc-issuer-url: https://dex.owncloud.ai
      oidc-username-claim: email
      oidc-groups-claim: groups
    disablePodSecurityPolicy: true
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1
          defaults:
            audit: restricted
            audit-version: latest
            enforce: baseline
            enforce-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            namespaces:
              - kube-system
              - gateway-system
            runtimeClasses: []
            usernames: []
          kind: PodSecurityConfiguration
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      # Trimmed 2026-09-11: Metadata-for-everything filled 100MB every ~30
      # minutes, so the audit log only ever held ~2.5h and could not answer
      # who deleted an OSD pod during the RCA. Reads, leader-election and
      # endpoint churn carry nothing forensic here.
      omitStages:
        - RequestReceived
      rules:
        - level: None
          verbs:
            - get
            - list
            - watch
        - level: None
          resources:
            - group: coordination.k8s.io
              resources:
                - leases
            - group: ""
              resources:
                - endpoints
                - events
            - group: discovery.k8s.io
              resources:
                - endpointslices
        - level: None
          users:
            - system:kube-proxy
            - system:apiserver
            - system:kube-scheduler
            - system:kube-controller-manager
        - level: Metadata
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
    image: registry.k8s.io/kube-controller-manager:v1.36.4
  proxy:
    image: registry.k8s.io/kube-proxy:v1.36.4
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
    image: registry.k8s.io/kube-scheduler:v1.36.4
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
  etcd:
    extraArgs:
      auto-compaction-retention: "1"
      listen-metrics-urls: http://0.0.0.0:2381
      # Raised from the 100ms/1000ms defaults because this cluster's etcd
      # data lives on Crucial BX500 SATA SSDs (DRAM-less consumer TLC),
      # where fsync p99 reaches 127ms and backend-commit p99 reaches
      # 333ms. At the defaults, followers cannot commit heartbeats in
      # time and trigger spurious leader elections (12-46/hour).
      # election-timeout must be 5-10x heartbeat-interval per etcd docs.
      heartbeat-interval: "500"
      election-timeout: "5000"
    ca:
      crt: ENC[AES256_GCM,data:,iv:uRVBOvhGY68bIkD+wTJ/+JCZOtQKGgApnWdTbX+Lto4=,tag:iS9OFPfKFakaJjfNf8zm+Q==,type:str]
      key: ENC[AES256_GCM,data:,iv:xujKLQTqicn1jGkhC2JOSzAOuisGiYw2W3PTTFltAuI=,tag:dD/SDL1Qv4BvaqmbO2zl+A==,type:str]
  extraManifests:
    - https://raw.githubusercontent.com/xUnholy/k8s-gitops/main/talos/integrations/cert-approver/cert-approver.yaml
    # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
    - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml
    # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
    - https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.93.0/stripped-down-crds.yaml
    # renovate: datasource=github-releases depName=k8snetworkplumbingwg/network-attachment-definition-client
    - https://github.com/k8snetworkplumbingwg/network-attachment-definition-client/raw/refs/tags/v1.7.7/artifacts/networks-crd.yaml
  inlineManifests: []
  allowSchedulingOnControlPlanes: true
sops:
